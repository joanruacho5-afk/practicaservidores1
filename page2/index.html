<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 2</title>
  <style>
    /* todo centrado para que el numero se vea grande al probar el balanceo */
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #1f2b3d 0%, #0e141d 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 22px;
      color: #c9d3e0;
      margin: 0 0 10px;
    }
    .trofeo { width: 110px; height: auto; }
    .numero {
      font-size: 140px;
      font-weight: bold;
      line-height: 1;
      color: #f2c14e;
      text-shadow: 0 4px 18px rgba(242, 193, 78, 0.35);
    }
    .etiqueta { font-size: 20px; color: #f2c14e; margin-top: 4px; }
    .server { margin-top: 30px; font-size: 14px; color: #8a97a8; }
  </style>
</head>
<body>
  <h1>Práctica Load Balancer</h1>

  <!-- trofeo hecho a mano en svg, nada de logos -->
  <svg class="trofeo" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
    <path d="M28 10 H72 V38 C72 54 62 64 50 64 C38 64 28 54 28 38 Z" fill="#f2c14e"/>
    <path d="M28 18 H14 C14 34 20 42 30 44" fill="none" stroke="#f2c14e" stroke-width="6" stroke-linecap="round"/>
    <path d="M72 18 H86 C86 34 80 42 70 44" fill="none" stroke="#f2c14e" stroke-width="6" stroke-linecap="round"/>
    <rect x="45" y="64" width="10" height="18" fill="#d9a735"/>
    <rect x="32" y="82" width="36" height="8" rx="2" fill="#d9a735"/>
    <rect x="26" y="90" width="48" height="12" rx="3" fill="#b88a26"/>
    <path d="M50 22 L53 30 L61 30 L55 35 L57 43 L50 38 L43 43 L45 35 L39 30 L47 30 Z" fill="#fff6dc"/>
  </svg>

  <!-- este numero es lo que cambia entre page1 (7) y page2 (8) -->
  <div class="numero">8</div>
  <div class="etiqueta">campeonatos</div>

  <p class="server">Respondió: Page 2 (rocky-web2)</p>
</body>
</html>
